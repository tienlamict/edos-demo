# === WEBUI (component chinh, HPA se scale cai nay) ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-webui
  namespace: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore-webui
  template:
    metadata:
      labels:
        app: teastore-webui
    spec:
      containers:
        - name: webui
          image: descartesresearch/teastore-webui:latest
          ports:
            - containerPort: 8080
          env:
            - name: HOST_NAME
              value: teastore-webui
            - name: REGISTRY_HOST
              value: teastore-registry
            - name: REGISTRY_PORT
              value: "8080"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-webui
  namespace: teastore
spec:
  type: NodePort
  selector:
    app: teastore-webui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080