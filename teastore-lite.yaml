# === DATABASE ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-db
  namespace: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore-db
  template:
    metadata:
      labels:
        app: teastore-db
    spec:
      containers:
        - name: db
          image: descartesresearch/teastore-db:latest
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-db
  namespace: teastore
spec:
  selector:
    app: teastore-db
  ports:
    - port: 3306
---
# === REGISTRY ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-registry
  namespace: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore-registry
  template:
    metadata:
      labels:
        app: teastore-registry
    spec:
      containers:
        - name: registry
          image: descartesresearch/teastore-registry:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-registry
  namespace: teastore
spec:
  selector:
    app: teastore-registry
  ports:
    - port: 8080
---
# === PERSISTENCE ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-persistence
  namespace: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore-persistence
  template:
    metadata:
      labels:
        app: teastore-persistence
    spec:
      containers:
        - name: persistence
          image: descartesresearch/teastore-persistence:latest
          ports:
            - containerPort: 8080
          env:
            - name: HOST_NAME
              value: teastore-persistence
            - name: REGISTRY_HOST
              value: teastore-registry
            - name: REGISTRY_PORT
              value: "8080"
            - name: DB_HOST
              value: teastore-db
            - name: DB_PORT
              value: "3306"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-persistence
  namespace: teastore
spec:
  selector:
    app: teastore-persistence
  ports:
    - port: 8080
---
